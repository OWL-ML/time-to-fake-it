[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aifacedetection"
version = "0.1.0"
description = "Fairness Analysis in AI Face Detection"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core dependencies
    "loguru>=0.6.0",
    "tqdm>=4.64.0",
    "matplotlib>=3.5.0",
    "torch>=2.9.0,<2.10",
    "torchvision>=0.24.0,<0.25",
    "pandas>=2.3.3",
    "scipy>=1.16.3",
    # "numpy>=2.3.5",
    "numpy<2",
    "transformers>=4.57.1",
    "timm>=1.0.22",
    "wandb>=0.23.0",
    "seaborn>=0.13.2",
    "scikit-learn>=1.7.2",
    "apricot-select>=0.6.1",
    "pyarrow>=20,<26",
    "python-dotenv>=1.2.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.txt"]

# On Linux, install PyTorch built for CUDA 12.8 (works with NVIDIA drivers
# for CUDA >= 12.8). PyPI's default Linux wheels can target newer CUDA
# versions than the GPU servers' drivers support. macOS uses the PyPI builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
