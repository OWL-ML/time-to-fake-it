[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aifacedetection"
version = "0.1.0"
description = "Fairness Analysis in AI Face Detection"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core dependencies
    "loguru>=0.6.0",
    "tqdm>=4.64.0",
    "matplotlib>=3.5.0",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "pandas>=2.3.3",
    "scipy>=1.16.3",
    # "numpy>=2.3.5",
    "numpy<2",
    "transformers>=4.57.1",
    "timm>=1.0.22",
    "wandb>=0.23.0",
    "seaborn>=0.13.2",
    "scikit-learn>=1.7.2",
    "apricot-select>=0.6.1",
    "pyarrow>=26.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.txt"]
